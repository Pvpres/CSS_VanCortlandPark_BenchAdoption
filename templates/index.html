<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Van Cortlandt Park Map</title>

  <!-- MapLibre GL CSS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Floating Filter Card -->
  <div class="filter-card">
    <div class="filter-title">Filter Benches</div>

    <!-- Part 1: Status Filter -->
    <div class="filter-group">
      <button class="filter-btn active" data-status="all">All</button>
      <button class="filter-btn" data-status="available"><span class="dot green"></span>Available</button>
      <button class="filter-btn" data-status="adopted"><span class="dot yellow"></span>Adopted</button>
    </div>

    <!-- Part 2: End Date Filter (Only for Adopted) -->
    <div class="date-filter-section" id="date-filter-section">
      <div class="filter-title">Adoption Expiration</div>
      <select class="date-select" id="date-select">
        <option value="all">All Expiration Dates</option>
        <option value="soon">Ending Soon (2026 / This Year)</option>
        <option value="midterm">Midterm (2027 – 2032)</option>
        <option value="recent">Recently Created (2033+)</option>
      </select>
    </div>

    <div class="filter-footer">
      <span id="bench-count">Showing all benches</span>
    </div>
  </div>

  <!-- Centered Adopt Modal Form -->
  <div class="modal-backdrop" id="adopt-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <h3 class="modal-title" id="modal-bench-title">Adopt Bench</h3>
          <div class="modal-subtitle" id="modal-bench-loc"></div>
        </div>
        <button type="button" class="modal-close-btn" id="modal-close-btn" onclick="closeAdoptModal()" aria-label="Close modal">&times;</button>
      </div>
      <form id="adopt-form">
        <input type="hidden" id="modal-bench-id" />
        <div class="form-group">
          <label class="form-label" for="donor-name-input">Donor Name *</label>
          <input type="text" id="donor-name-input" class="form-input" placeholder="e.g. Elena Rivera" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="donor-email-input">Email Address *</label>
          <input type="email" id="donor-email-input" class="form-input" placeholder="you@example.com" required />
          <span class="form-helper">Private, used only for park verification.</span>
        </div>
        <div class="form-group">
          <label class="form-label" for="dedication-input">Dedication Plaque Inscription</label>
          <textarea id="dedication-input" class="form-input" placeholder="e.g. In loving memory of..."></textarea>
          <span class="form-helper">Term lasts 10 years from today.</span>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeAdoptModal()">Cancel</button>
          <button type="submit" class="btn-submit" id="btn-submit-adopt">Adopt for 10 Years</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- Server-injected data container (prevents JavaScript linter syntax errors) -->
  <script id="benches-data" type="application/json">
    {{ benches | tojson | safe if benches is defined else '[]' }}
  </script>

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <script>
    // 1. Initialize Minimalist Positron Map
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/positron',
      center: [-73.886, 40.897],
      zoom: 14
    });

    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

    let allBenches = [];
    let currentMarkers = [];
    let activeStatus = "all";
    let activeDateFilter = "all";

    // 2. Render Markers onto Map
    function renderMarkers(benches) {
      // Clear existing markers
      currentMarkers.forEach(marker => marker.remove());
      currentMarkers = [];

      benches.forEach(bench => {
        const isAvailable = bench.available;
        const pinClass = isAvailable ? "available" : "adopted";

        const el = document.createElement("div");
        el.className = `pin ${pinClass}`;
        el.setAttribute("title", `${bench.location} (${isAvailable ? "Available" : "Adopted"})`);

        let popupHtml = `
          <div class="popup-content-inner">
            <h4 class="popup-title">${bench.location}</h4>
            <div class="popup-id">ID: ${bench.id}</div>
            <span class="popup-status ${pinClass}">
              ${isAvailable ? "Available" : "Adopted"}
            </span>
        `;

        if (isAvailable) {
          popupHtml += `
            <button type="button" class="btn-adopt-popup" onclick="openAdoptModal('${bench.id}')">
              Adopt this Bench
            </button>
          `;
        } else if (bench.current_adoption) {
          popupHtml += `
            <div class="popup-adoption-details">
              <div><b>Dedicated by:</b> ${bench.current_adoption.donor_name}</div>
              ${bench.current_adoption.dedication ? `<div class="popup-dedication">“${bench.current_adoption.dedication}”</div>` : ""}
              <div class="popup-term">Term ends: ${bench.current_adoption.end_date}</div>
            </div>
          `;
        }

        popupHtml += `</div>`;

        const popup = new maplibregl.Popup({ offset: 12, closeButton: false })
          .setLngLat([bench.longitude, bench.latitude])
          .setHTML(popupHtml);

        const marker = new maplibregl.Marker({ element: el })
          .setLngLat([bench.longitude, bench.latitude])
          .setPopup(popup)
          .addTo(map);

        // Hover handling to display popup and allow moving cursor into popup
        let hoverTimeout = null;

        el.addEventListener("mouseenter", () => {
          clearTimeout(hoverTimeout);
          if (!popup.isOpen()) {
            popup.addTo(map);
          }

          const popupEl = popup.getElement();
          if (popupEl && !popupEl.dataset.hoverBound) {
            popupEl.dataset.hoverBound = "true";
            popupEl.addEventListener("mouseenter", () => {
              clearTimeout(hoverTimeout);
            });
            popupEl.addEventListener("mouseleave", () => {
              hoverTimeout = setTimeout(() => {
                popup.remove();
              }, 250);
            });
          }
        });

        el.addEventListener("mouseleave", () => {
          hoverTimeout = setTimeout(() => {
            popup.remove();
          }, 250);
        });

        currentMarkers.push(marker);
      });

      // Update count text
      const countEl = document.getElementById("bench-count");
      countEl.textContent = `Showing ${benches.length} of ${allBenches.length} benches`;
    }

    // 3. Modal & Adoption Logic
    function openAdoptModal(benchId) {
      // Close active popups
      currentMarkers.forEach(m => {
        const p = m.getPopup();
        if (p && p.isOpen()) p.remove();
      });

      const bench = allBenches.find(b => b.id === benchId);
      if (!bench) return;

      document.getElementById("modal-bench-id").value = bench.id;
      document.getElementById("modal-bench-title").textContent = `Adopt Bench ${bench.id}`;
      document.getElementById("modal-bench-loc").textContent = bench.location;
      document.getElementById("donor-name-input").value = "";
      document.getElementById("donor-email-input").value = "";
      document.getElementById("dedication-input").value = "";

      document.getElementById("adopt-modal").classList.add("open");
      document.getElementById("donor-name-input").focus();
    }

    function closeAdoptModal() {
      document.getElementById("adopt-modal").classList.remove("open");
    }

    // Close modal when clicking backdrop or pressing Escape
    document.getElementById("adopt-modal").addEventListener("click", (e) => {
      if (e.target.id === "adopt-modal") {
        closeAdoptModal();
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeAdoptModal();
      }
    });

    // Form submit handler
    document.getElementById("adopt-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const benchId = document.getElementById("modal-bench-id").value;
      const donorName = document.getElementById("donor-name-input").value.trim();
      const email = document.getElementById("donor-email-input").value.trim();
      const dedication = document.getElementById("dedication-input").value.trim();

      const submitBtn = document.getElementById("btn-submit-adopt");
      const origText = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = "Processing...";

      try {
        const res = await fetch(`/api/benches/${benchId}/adopt`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            donor_name: donorName,
            email: email,
            dedication: dedication
          })
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.error || "Unable to adopt bench. Please try again.");
          return;
        }

        // Update local bench state
        const target = allBenches.find(b => b.id === benchId);
        if (target) {
          target.available = false;
          target.current_adoption = data.adoption;
        }

        closeAdoptModal();
        applyFilters();
        showToast(`Bench ${benchId} successfully adopted!`);
      } catch (err) {
        console.error("Adoption error:", err);
        alert("A network error occurred. Please try again.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = origText;
      }
    });

    // Toast helper
    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove("show");
      }, 3500);
    }

    // 4. Filter Logic
    function applyFilters() {
      let filtered = allBenches;

      // Part 1: Filter by Status
      if (activeStatus === "available") {
        filtered = filtered.filter(b => b.available);
      } else if (activeStatus === "adopted") {
        filtered = filtered.filter(b => !b.available);

        // Part 2: Filter by End Date (only active if Adopted is selected)
        if (activeDateFilter !== "all") {
          filtered = filtered.filter(b => {
            if (!b.current_adoption || !b.current_adoption.end_date) return false;
            const endYear = parseInt(b.current_adoption.end_date.slice(0, 4), 10);

            if (activeDateFilter === "soon") {
              return endYear <= 2026;
            } else if (activeDateFilter === "midterm") {
              return endYear > 2026 && endYear <= 2032;
            } else if (activeDateFilter === "recent") {
              return endYear >= 2033;
            }
            return true;
          });
        }
      }

      renderMarkers(filtered);
    }

    // 5. UI Event Listeners for Filters
    const dateSection = document.getElementById("date-filter-section");
    const dateSelect = document.getElementById("date-select");

    // Status button clicks
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeStatus = btn.dataset.status;

        // Show Part 2 (End Date) ONLY if "Adopted" is selected
        if (activeStatus === "adopted") {
          dateSection.classList.add("visible");
        } else {
          dateSection.classList.remove("visible");
          activeDateFilter = "all";
          dateSelect.value = "all";
        }

        applyFilters();
      });
    });

    // End date select change
    dateSelect.addEventListener("change", (e) => {
      activeDateFilter = e.target.value;
      applyFilters();
    });

    // 6. Initial Load
    map.on('load', () => {
      const dataEl = document.getElementById("benches-data");
      let serverBenches = null;
      if (dataEl && dataEl.textContent.trim()) {
        try {
          serverBenches = JSON.parse(dataEl.textContent);
        } catch (e) {
          serverBenches = null;
        }
      }

      if (serverBenches && serverBenches.length) {
        allBenches = serverBenches;
        applyFilters();
      } else {
        fetch('/api/benches')
          .then(res => res.json())
          .then(data => {
            allBenches = data;
            applyFilters();
          })
          .catch(err => console.error("Error loading benches:", err));
      }
    });
  </script>
</body>
</html>
