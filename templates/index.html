<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Van Cortlandt Park Map</title>

  <!-- MapLibre GL CSS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Floating Filter Card -->
  <div class="filter-card">
    <div class="filter-title">Filter Benches</div>

    <!-- Part 1: Status Filter -->
    <div class="filter-group">
      <button class="filter-btn active" data-status="all">All</button>
      <button class="filter-btn" data-status="available"><span class="dot green"></span>Available</button>
      <button class="filter-btn" data-status="adopted"><span class="dot yellow"></span>Adopted</button>
    </div>

    <!-- Part 2: End Date Filter (Only for Adopted) -->
    <div class="date-filter-section" id="date-filter-section">
      <div class="filter-title">Adoption Expiration</div>
      <select class="date-select" id="date-select">
        <option value="all">All Expiration Dates</option>
        <option value="soon">Ending Soon (2026 / This Year)</option>
        <option value="midterm">Midterm (2027 – 2032)</option>
        <option value="recent">Recently Created (2033+)</option>
      </select>
    </div>

    <div class="filter-footer">
      <span id="bench-count">Showing all benches</span>
    </div>
  </div>

  <!-- Centered Adopt Modal Form -->
  <div class="modal-backdrop" id="adopt-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <h3 class="modal-title" id="modal-bench-title">Adopt Bench</h3>
          <div class="modal-subtitle" id="modal-bench-loc"></div>
        </div>
        <button type="button" class="modal-close-btn" id="modal-close-btn" onclick="closeAdoptModal()" aria-label="Close modal">&times;</button>
      </div>
      <form id="adopt-form">
        <input type="hidden" id="modal-bench-id" />
        <div class="form-group">
          <label class="form-label" for="donor-name-input">Donor Name *</label>
          <input type="text" id="donor-name-input" class="form-input" placeholder="e.g. Elena Rivera" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="donor-email-input">Email Address *</label>
          <input type="email" id="donor-email-input" class="form-input" placeholder="you@example.com" required />
          <span class="form-helper">Private, used only for park verification.</span>
        </div>
        <div class="form-group">
          <label class="form-label" for="duration-select">Adoption Length *</label>
          <select id="duration-select" name="duration_months" class="form-input" required>
            <option value="6">6 Months</option>
            <option value="12">1 Year</option>
            <option value="24">2 Years</option>
            <option value="36">3 Years</option>
            <option value="48">4 Years</option>
            <option value="60">5 Years</option>
            <option value="72">6 Years</option>
            <option value="84">7 Years</option>
            <option value="96">8 Years</option>
            <option value="108">9 Years</option>
            <option value="120" selected>10 Years</option>
          </select>
          <span class="form-helper" id="duration-helper">Select duration (6 months up to 10 years).</span>
        </div>
        <div class="form-group">
          <label class="form-label" for="dedication-input">Dedication Plaque Inscription</label>
          <textarea id="dedication-input" class="form-input" placeholder="e.g. In loving memory of..."></textarea>
          <span class="form-helper">Inscribed on the bench plaque.</span>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeAdoptModal()">Cancel</button>
          <button type="submit" class="btn-submit" id="btn-submit-adopt">Adopt for 10 Years</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- Server-injected data container (prevents JavaScript linter syntax errors) -->
  <script id="benches-data" type="application/json">
    {{ benches | tojson | safe if benches is defined else '[]' }}
  </script>

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <script>
    // 1. Initialize Minimalist Positron Map
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/positron',
      center: [-73.886, 40.897],
      zoom: 14
    });

    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

    let allBenches = [];
    let currentMarkers = [];
    let activeStatus = "all";
    let activeDateFilter = "all";

    // 2. Filter Helper
    function getFilteredBenches() {
      let filtered = allBenches;

      if (activeStatus === "available") {
        filtered = filtered.filter(b => b.available);
      } else if (activeStatus === "adopted") {
        filtered = filtered.filter(b => !b.available);

        if (activeDateFilter !== "all") {
          filtered = filtered.filter(b => {
            if (!b.current_adoption || !b.current_adoption.end_date) return false;
            const endYear = parseInt(b.current_adoption.end_date.slice(0, 4), 10);
            if (activeDateFilter === "soon") return endYear <= 2026;
            if (activeDateFilter === "midterm") return endYear > 2026 && endYear <= 2032;
            if (activeDateFilter === "recent") return endYear >= 2033;
            return true;
          });
        }
      }

      return filtered;
    }

    // 3. Screen-Pixel Distance Clustering Algorithm (Unclusters at zoom >= 16)
    function clusterBenches(benches, radius = 45) {
      if (map.getZoom() >= 16) {
        return benches.map(b => ({
          isCluster: false,
          coordinates: [b.longitude, b.latitude],
          bench: b
        }));
      }

      const clusters = [];
      const visited = new Set();
      const points = benches.map((bench, i) => {
        const p = map.project([bench.longitude, bench.latitude]);
        return { index: i, bench, x: p.x, y: p.y };
      });

      for (let i = 0; i < points.length; i++) {
        if (visited.has(i)) continue;
        visited.add(i);

        const group = [points[i]];

        for (let j = i + 1; j < points.length; j++) {
          if (visited.has(j)) continue;
          const dx = points[i].x - points[j].x;
          const dy = points[i].y - points[j].y;
          if (Math.hypot(dx, dy) < radius) {
            visited.add(j);
            group.push(points[j]);
          }
        }

        if (group.length === 1) {
          clusters.push({
            isCluster: false,
            coordinates: [group[0].bench.longitude, group[0].bench.latitude],
            bench: group[0].bench
          });
        } else {
          const avgLng = group.reduce((sum, p) => sum + p.bench.longitude, 0) / group.length;
          const avgLat = group.reduce((sum, p) => sum + p.bench.latitude, 0) / group.length;
          clusters.push({
            isCluster: true,
            coordinates: [avgLng, avgLat],
            benches: group.map(p => p.bench),
            pointCount: group.length
          });
        }
      }

      return clusters;
    }

    // 4. Hover Helper for Map Popups
    function bindPopupHover(el, popup) {
      let hoverTimeout = null;

      el.addEventListener("mouseenter", () => {
        clearTimeout(hoverTimeout);
        if (!popup.isOpen()) popup.addTo(map);

        const popupEl = popup.getElement();
        if (popupEl && !popupEl.dataset.hoverBound) {
          popupEl.dataset.hoverBound = "true";
          popupEl.addEventListener("mouseenter", () => clearTimeout(hoverTimeout));
          popupEl.addEventListener("mouseleave", () => {
            hoverTimeout = setTimeout(() => popup.remove(), 250);
          });
        }
      });

      el.addEventListener("mouseleave", () => {
        hoverTimeout = setTimeout(() => popup.remove(), 250);
      });
    }

    // 5. Render Markers & Clusters onto Map (Styled purely via CSS classes)
    function renderMarkers() {
      currentMarkers.forEach(m => m.remove());
      currentMarkers = [];

      const filtered = getFilteredBenches();
      const clusters = clusterBenches(filtered);

      clusters.forEach(item => {
        if (item.isCluster) {
          const availCount = item.benches.filter(b => b.available).length;
          const adoptedCount = item.pointCount - availCount;

          let statusClass = "mixed";
          if (adoptedCount === 0) {
            statusClass = "all-available";
          } else if (availCount === 0) {
            statusClass = "all-adopted";
          }

          const el = document.createElement("div");
          const sizeClass = item.pointCount < 8 ? "small" : item.pointCount < 20 ? "medium" : "large";
          el.className = `cluster ${sizeClass} ${statusClass}`;
          el.innerHTML = `<span>${item.pointCount}</span>`;
          const tooltipHtml = `
            <div class="cluster-tooltip-inner">
              <div class="cluster-tooltip-count">${item.pointCount} Benches</div>
              <div class="cluster-tooltip-breakdown">
                <span class="dot green"></span> ${availCount} Available
                &nbsp;•&nbsp;
                <span class="dot yellow"></span> ${adoptedCount} Adopted
              </div>
              <div class="cluster-tooltip-hint">Click to zoom in</div>
            </div>
          `;

          const popup = new maplibregl.Popup({ offset: 14, closeButton: false, className: 'cluster-tooltip' })
            .setLngLat(item.coordinates)
            .setHTML(tooltipHtml);

          el.addEventListener("mouseenter", () => popup.addTo(map));
          el.addEventListener("mouseleave", () => popup.remove());

          // Click cluster: zoom in to expand
          el.addEventListener("click", () => {
            popup.remove();
            map.easeTo({
              center: item.coordinates,
              zoom: map.getZoom() + 2
            });
          });

          const marker = new maplibregl.Marker({ element: el })
            .setLngLat(item.coordinates)
            .addTo(map);
          currentMarkers.push(marker);
        } else {
          // Individual bench marker styled in style.css (.pin.available / .pin.adopted)
          const bench = item.bench;
          const isAvailable = bench.available;
          const pinClass = isAvailable ? "available" : "adopted";

          const el = document.createElement("div");
          el.className = `pin ${pinClass}`;
          el.setAttribute("title", `${bench.location} (${isAvailable ? "Available" : "Adopted"})`);

          let popupHtml = `
            <div class="popup-content-inner">
              <h4 class="popup-title">${bench.location}</h4>
              <div class="popup-id">ID: ${bench.id}</div>
              <span class="popup-status ${pinClass}">
                ${isAvailable ? "Available" : "Adopted"}
              </span>
          `;

          if (isAvailable) {
            popupHtml += `
              <button type="button" class="btn-adopt-popup" onclick="openAdoptModal('${bench.id}')">
                Adopt this Bench
              </button>
            `;
          } else if (bench.current_adoption) {
            popupHtml += `
              <div class="popup-adoption-details">
                <div><b>Dedicated by:</b> ${bench.current_adoption.donor_name}</div>
                ${bench.current_adoption.dedication ? `<div class="popup-dedication">“${bench.current_adoption.dedication}”</div>` : ""}
                <div class="popup-term">Term ends: ${bench.current_adoption.end_date}</div>
              </div>
            `;
          }

          popupHtml += `</div>`;

          const popup = new maplibregl.Popup({ offset: 12, closeButton: false })
            .setLngLat(item.coordinates)
            .setHTML(popupHtml);

          const marker = new maplibregl.Marker({ element: el })
            .setLngLat(item.coordinates)
            .setPopup(popup)
            .addTo(map);

          bindPopupHover(el, popup);
          currentMarkers.push(marker);
        }
      });

      // Update count text in filter card footer
      const countEl = document.getElementById("bench-count");
      if (countEl) {
        countEl.textContent = `Showing ${filtered.length} of ${allBenches.length} benches`;
      }
    }

    // 6. Modal & Adoption Logic
    function updateDurationUI() {
      const select = document.getElementById("duration-select");
      const helper = document.getElementById("duration-helper");
      const submitBtn = document.getElementById("btn-submit-adopt");
      if (!select) return;
      const months = parseInt(select.value, 10);
      const selectedText = select.options[select.selectedIndex].text;

      const endDate = new Date();
      endDate.setMonth(endDate.getMonth() + months);
      const formattedDate = endDate.toLocaleDateString(undefined, {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });

      if (helper) {
        helper.textContent = `Term lasts ${selectedText.toLowerCase()} (expires approx. ${formattedDate}).`;
      }
      if (submitBtn && !submitBtn.disabled) {
        submitBtn.textContent = `Adopt for ${selectedText}`;
      }
    }

    document.getElementById("duration-select").addEventListener("change", updateDurationUI);

    function openAdoptModal(benchId) {
      currentMarkers.forEach(m => {
        const p = m.getPopup();
        if (p && p.isOpen()) p.remove();
      });

      const bench = allBenches.find(b => b.id === benchId);
      if (!bench) return;

      document.getElementById("modal-bench-id").value = bench.id;
      document.getElementById("modal-bench-title").textContent = `Adopt Bench ${bench.id}`;
      document.getElementById("modal-bench-loc").textContent = bench.location;
      document.getElementById("donor-name-input").value = "";
      document.getElementById("donor-email-input").value = "";
      document.getElementById("dedication-input").value = "";
      document.getElementById("duration-select").value = "120";
      updateDurationUI();

      document.getElementById("adopt-modal").classList.add("open");
      document.getElementById("donor-name-input").focus();
    }

    function closeAdoptModal() {
      document.getElementById("adopt-modal").classList.remove("open");
    }

    document.getElementById("adopt-modal").addEventListener("click", (e) => {
      if (e.target.id === "adopt-modal") closeAdoptModal();
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeAdoptModal();
    });

    // Form submit handler
    document.getElementById("adopt-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const benchId = document.getElementById("modal-bench-id").value;
      const donorName = document.getElementById("donor-name-input").value.trim();
      const email = document.getElementById("donor-email-input").value.trim();
      const dedication = document.getElementById("dedication-input").value.trim();
      const durationMonths = parseInt(document.getElementById("duration-select").value, 10);

      const submitBtn = document.getElementById("btn-submit-adopt");
      submitBtn.disabled = true;
      submitBtn.textContent = "Processing...";

      try {
        const res = await fetch(`/api/benches/${benchId}/adopt`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            donor_name: donorName,
            email: email,
            dedication: dedication,
            duration_months: durationMonths
          })
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.error || "Unable to adopt bench. Please try again.");
          return;
        }

        const target = allBenches.find(b => b.id === benchId);
        if (target) {
          target.available = false;
          target.current_adoption = data.adoption;
        }

        closeAdoptModal();
        renderMarkers();
        showToast(`Bench ${benchId} successfully adopted!`);
      } catch (err) {
        console.error("Adoption error:", err);
        alert("A network error occurred. Please try again.");
      } finally {
        submitBtn.disabled = false;
        updateDurationUI();
      }
    });

    // Toast helper
    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove("show");
      }, 3500);
    }

    // 7. Filter Event Listeners
    const dateSection = document.getElementById("date-filter-section");
    const dateSelect = document.getElementById("date-select");

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeStatus = btn.dataset.status;

        if (activeStatus === "adopted") {
          dateSection.classList.add("visible");
        } else {
          dateSection.classList.remove("visible");
          activeDateFilter = "all";
          dateSelect.value = "all";
        }

        renderMarkers();
      });
    });

    dateSelect.addEventListener("change", (e) => {
      activeDateFilter = e.target.value;
      renderMarkers();
    });

    // 8. Re-cluster on Map Navigation (Pan / Zoom)
    map.on('moveend', renderMarkers);

    // 9. Initial Load
    map.on('load', () => {
      const dataEl = document.getElementById("benches-data");
      let serverBenches = null;
      if (dataEl && dataEl.textContent.trim()) {
        try {
          serverBenches = JSON.parse(dataEl.textContent);
        } catch (e) {
          serverBenches = null;
        }
      }

      if (serverBenches && serverBenches.length) {
        allBenches = serverBenches;
        renderMarkers();
      } else {
        fetch('/api/benches')
          .then(res => res.json())
          .then(data => {
            allBenches = data;
            renderMarkers();
          })
          .catch(err => console.error("Error loading benches:", err));
      }
    });
  </script>
</body>
</html>
